name: Daily TWN Reel

on:
  schedule:
    - cron: "30 12 * * *"   # roz shaam 6:00 baje (India time)
  workflow_dispatch:
    inputs:
      mode:
        description: "text ya image"
        required: false
        default: "text"
      image:
        description: "image path/URL (image mode me)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: twn-daily
  cancel-in-progress: false

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Python dependencies
        run: pip install -r requirements.txt

      - name: Content (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TTS_VOICE: en-IN-NeerjaNeural
        run: python scripts/content.py

      - name: Video engine
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FREEAI_API_KEY: ${{ secrets.FREEAI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          INPUT_IMAGE: ${{ github.event.inputs.image }}
          MODE: ${{ github.event.inputs.mode }}
        run: python scripts/video_engine.py

      - name: Render reel
        env:
          TTS_VOICE: en-IN-NeerjaNeural
        run: python scripts/render.py

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="reel-$(date -u +%Y%m%d-%H%M)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          gh release create "$TAG" reel.mp4 caption.txt \
            --title "TWN Reel $TAG" --notes "Auto-generated reel" \
            || gh release upload "$TAG" reel.mp4 caption.txt --clobber

      - name: Publish (Instagram + Facebook + YouTube)
        env:
          RELEASE_URL: https://github.com/dilshanking7/twn-auto-videos/releases/download/${{ env.TAG }}/reel.mp4
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          YT_TOKEN: ${{ secrets.YT_TOKEN }}
          PRIVACY: public
        run: python scripts/publish.py

      - name: Save state
        if: always()
        run: |
          git config user.name "twn-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json work/content.json work/engine_report.json work/render_report.json work/publish_report.json
          git commit -m "update state" || echo "nothing to commit"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break || sleep 5; done
